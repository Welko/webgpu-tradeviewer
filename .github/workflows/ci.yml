name: CI

# On every push to main: build and test natively, build the web app, then
# publish the web build (docs/) to GitHub Pages if everything passed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two Pages deployments at once, but let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  EMSDK_VERSION: 6.0.13
  # Every test run writes JUnit XML here (see cpp/cmake/testing.cmake); the
  # summary job turns it into one table on the run's page.
  TRADEVIEWER_JUNIT_DIR: ${{ github.workspace }}/test-results

jobs:
  native:
    name: Native build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # GLFW's build dependencies, plus the Vulkan loader and Mesa's software
      # Vulkan driver (lavapipe): the runner has no GPU, and the GPU tests
      # need one.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libvulkan1 mesa-vulkan-drivers

      - name: Configure
        working-directory: cpp
        run: cmake --preset native

      - name: Build
        working-directory: cpp
        run: cmake --build --preset native -j "$(nproc)"

      - name: Test
        working-directory: cpp
        run: ctest --test-dir build/native --output-on-failure --no-tests=error

      # Keeps the compiled-out stubs building and passing.
      - name: Build and test with profiling compiled out
        working-directory: cpp
        run: |
          cmake --preset native -B build/native-noprofiling -DTRADEVIEWER_PROFILING=OFF
          cmake --build build/native-noprofiling -j "$(nproc)"
          ctest --test-dir build/native-noprofiling --output-on-failure --no-tests=error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-native
          path: test-results
          if-no-files-found: ignore

  web:
    name: Web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Builds the wasm module, type-checks, and writes the site to docs/.
      - name: Build
        working-directory: web
        run: |
          source ~/emsdk/emsdk_env.sh
          npm run build

      # The same tests as the native job, compiled to wasm and run in Node.
      # Catches wasm32 differences: 32-bit size_t/long, libc++, no exceptions.
      - name: Test (wasm in Node)
        working-directory: cpp
        run: |
          source ~/emsdk/emsdk_env.sh
          ctest --test-dir build/web --output-on-failure --no-tests=error

      # Smoke-tests the built site in Chromium, with WebGPU on SwiftShader
      # (bundled with Chromium), since the runner has no GPU.
      - name: Install Playwright's Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Test (site in Chromium)
        working-directory: web
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-web
          path: test-results
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  summary:
    name: Test summary
    needs: [native, web]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Nothing to download if every build failed; the script says so.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: Write the summary
        run: node .github/scripts/test-summary.mjs test-results >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish to GitHub Pages
    needs: [native, web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5

name: CI

# On every push to main: build and test natively, build the web app, then
# publish the web build (docs/) to GitHub Pages if everything passed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two Pages deployments at once, but let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  EMSDK_VERSION: 6.0.13

jobs:
  native:
    name: Native build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install GLFW build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        working-directory: cpp
        run: cmake --preset native

      - name: Build
        working-directory: cpp
        run: cmake --build --preset native -j "$(nproc)"

      - name: Test
        working-directory: cpp
        run: ctest --test-dir build/native --output-on-failure --no-tests=error

      # Keeps the compiled-out stubs building and passing.
      - name: Build and test with profiling compiled out
        working-directory: cpp
        run: |
          cmake --preset native -B build/native-noprofiling -DTRADEVIEWER_PROFILING=OFF
          cmake --build build/native-noprofiling -j "$(nproc)"
          ctest --test-dir build/native-noprofiling --output-on-failure --no-tests=error

  web:
    name: Web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Builds the wasm module, type-checks, and writes the site to docs/.
      - name: Build
        working-directory: web
        run: |
          source ~/emsdk/emsdk_env.sh
          npm run build

      # The same tests as the native job, compiled to wasm and run in Node.
      # Catches wasm32 differences: 32-bit size_t/long, libc++, no exceptions.
      - name: Test (wasm in Node)
        working-directory: cpp
        run: |
          source ~/emsdk/emsdk_env.sh
          ctest --test-dir build/web --output-on-failure --no-tests=error

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Publish to GitHub Pages
    needs: [native, web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5

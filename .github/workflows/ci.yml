name: CI

# On every push to dev or main: build and test natively and for the web,
# compare the image-test scenes as each platform draws them, and check memory
# and times against tools/regression-baseline.csv. On main, if everything
# passed, also publish the site
# (docs/, with the comparison under ci/renderings/) to GitHub Pages and the
# native binary to the "latest" release.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, so main never publishes twice at once; a
# running one finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  EMSDK_VERSION: 6.0.13
  # The shader compiler in wgpu-native v29; the build checks every shader with it.
  NAGA_VERSION: 29.0.4
  # Every test run writes JUnit XML here (see cpp/cmake/testing.cmake); the
  # summary job turns it into one table on the run's page.
  TRADEVIEWER_JUNIT_DIR: ${{ github.workspace }}/test-results

jobs:
  native:
    name: Native build and tests
    runs-on: ubuntu-24.04
    steps:
      # All of history: the benchmark builds the baseline's commit too.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # GLFW's build dependencies, zlib, and the Vulkan loader with Mesa's
      # software Vulkan driver (lavapipe): the runner has no GPU, and the GPU
      # tests need one. Xvfb for a window to draw the scenes through.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            zlib1g-dev libvulkan1 mesa-vulkan-drivers xvfb xauth

      # Cargo comes with the runner; the cache skips building naga again.
      - name: Cache naga
        id: naga-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/naga
          key: naga-${{ env.NAGA_VERSION }}-${{ runner.os }}

      - name: Install naga
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked

      - name: Configure
        working-directory: cpp
        run: cmake --preset native -DTRADEVIEWER_REQUIRE_NAGA=ON

      - name: Build
        working-directory: cpp
        run: cmake --build --preset native -j "$(nproc)"

      - name: Test
        working-directory: cpp
        run: ctest --test-dir build/native --output-on-failure --no-tests=error

      # Task 1 asks for the visible count and amount of three fixed ranges to
      # match an independent calculation. TradeStatsApp runs the viewer's code and
      # tools/check_ranges.py works them out on its own, here on Binance's
      # public copy of the brief's day. The table goes on the run's page.
      - name: Check visible counts and amounts
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/trades.zip" \
            https://data.binance.vision/data/spot/daily/trades/BTCUSDT/BTCUSDT-trades-2019-12-01.zip
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/trades.zip"
          echo "### Visible count and amount, against an independent calculation" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/check_ranges.py cpp/build/native/apps/TradeStatsApp/TradeStatsApp \
            "$RUNNER_TEMP/BTCUSDT-trades-2019-12-01.csv" | tee -a "$GITHUB_STEP_SUMMARY"

      # The image-test scenes through a real window and surface, which the
      # offscreen tests don't use, checked against their known pixels and
      # saved for the compare job. Then the viewer opens a real day's file and
      # draws it once.
      - name: Draw the scenes and a file through a window
        run: |
          xvfb-run -a tools/render-native.sh cpp/build/native/apps/ViewerApp/ViewerApp renderings/native
          xvfb-run -a cpp/build/native/apps/ViewerApp/ViewerApp "$RUNNER_TEMP/BTCUSDT-trades-2019-12-01.csv" \
            --snapshot="$RUNNER_TEMP/file.png"

      - name: Upload the renderings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderings-native
          path: renderings
          if-no-files-found: ignore

      # Keeps the compiled-out stubs building and passing.
      - name: Build and test with profiling compiled out
        working-directory: cpp
        run: |
          cmake --preset native -B build/native-noprofiling -DTRADEVIEWER_PROFILING=OFF
          cmake --build build/native-noprofiling -j "$(nproc)"
          ctest --test-dir build/native-noprofiling --output-on-failure --no-tests=error

      # One self-contained binary, with wgpu-native linked in statically.
      - name: Build and test the release binary
        working-directory: cpp
        run: |
          cmake --preset native-release
          cmake --build --preset native-release -j "$(nproc)"
          ctest --test-dir build/native-release --output-on-failure --no-tests=error

      # CI's machines differ by up to twice in speed, so times are compared
      # with the baseline's commit measured on this one: BenchmarkApp, built
      # at the commit of the last accepted row (see tools/check-regressions.mjs).
      - name: Build the baseline's commit
        run: |
          commit=$(node tools/check-regressions.mjs baseline-commit native)
          git worktree add --detach "$RUNNER_TEMP/baseline" "$commit"
          cd "$RUNNER_TEMP/baseline/cpp"
          cmake --preset native-release
          cmake --build --preset native-release --target BenchmarkApp -j "$(nproc)"

      # Frame times at four zoom levels, and the whole day without summaries,
      # from the profiler: the CPU phases and each GPU pass. Three runs of
      # this commit and three of the baseline's, taking turns to go first, so
      # neither gains from going first or loses to a busy moment; each
      # number's median goes in benchmark.json. The file is read once first,
      # so no run reads it cold. The first run's table goes on the run's page.
      - name: Benchmark this commit and the baseline's
        env:
          TRADES: ${{ runner.temp }}/BTCUSDT-trades-2019-12-01.csv
        run: |
          mkdir -p benchmark/runs benchmark/baseline/runs
          cat "$TRADES" > /dev/null
          baseline_commit=$(git -C "$RUNNER_TEMP/baseline" rev-parse HEAD)
          this=0
          other=0
          for side in baseline this this baseline baseline this; do
            if [ "$side" = this ]; then
              this=$((this + 1))
              cpp/build/native-release/apps/BenchmarkApp/BenchmarkApp "benchmark/runs/$this.md" "$TRADES" --commit "$GITHUB_SHA"
            else
              other=$((other + 1))
              "$RUNNER_TEMP/baseline/cpp/build/native-release/apps/BenchmarkApp/BenchmarkApp" "benchmark/baseline/runs/$other.md" \
                "$TRADES" --commit "$baseline_commit"
            fi
          done
          node tools/check-regressions.mjs median benchmark/benchmark.json benchmark/runs/*.json
          node tools/check-regressions.mjs median benchmark/baseline/benchmark.json benchmark/baseline/runs/*.json
          { echo "### Frame times on lavapipe (a CPU Vulkan driver), this commit's first run"; cat benchmark/runs/1.md; } >> "$GITHUB_STEP_SUMMARY"

      # Both commits' runs and medians: benchmark.json is what accept takes.
      - uses: actions/upload-artifact@v7
        id: benchmark-artifact
        with:
          name: benchmark-native
          path: benchmark/
          if-no-files-found: error

      # Memory exactly against the last accepted numbers in
      # tools/regression-baseline.csv, times within a margin against the
      # baseline's commit on this machine. Any change past them fails, faster
      # or smaller too, and the summary gives the commands that accept this
      # run's numbers, with and without the GitHub CLI.
      - name: Check memory and times against the baseline
        env:
          ARTIFACT_URL: ${{ steps.benchmark-artifact.outputs.artifact-url }}
        run: |
          if node tools/check-regressions.mjs check benchmark/benchmark.json --baseline benchmark/baseline/benchmark.json \
            --summary "$RUNNER_TEMP/check.md" --run-id "$GITHUB_RUN_ID" --artifact-url "$ARTIFACT_URL"; then
            status=0
          else
            status=$?
          fi
          { cat "$RUNNER_TEMP/check.md"
            echo "Every accepted change: [regression-baseline.csv](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/tools/regression-baseline.csv)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The stripped binary, with the licenses of what's linked into it.
      - name: Package the release binary
        run: |
          build=cpp/build/native-release
          package=dist/trade-viewer
          mkdir -p "$package"
          cp "$build/apps/ViewerApp/ViewerApp" "$package/"
          strip "$package/ViewerApp"
          cp "$build/_deps/glfw-src/LICENSE.md" "$package/LICENSE-glfw.md"
          wgpu_tag=$(cat "$build/_deps/wgpu-linux-x86_64-release-src/wgpu-native-meta/wgpu-native-git-tag")
          curl -fsSL "https://raw.githubusercontent.com/gfx-rs/wgpu-native/$wgpu_tag/LICENSE.MIT" -o "$package/LICENSE-wgpu-native.txt"
          tar -czf dist/trade-viewer-linux-x86_64.tar.gz -C dist trade-viewer

      - uses: actions/upload-artifact@v7
        with:
          name: native-release
          path: dist/trade-viewer-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-native
          path: test-results
          if-no-files-found: ignore

  web:
    name: Web build and tests
    runs-on: ubuntu-24.04
    steps:
      # All of history: the benchmark builds the baseline's commit too.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Builds the wasm module, type-checks, and writes the site to docs/.
      - name: Build
        working-directory: web
        run: |
          source ~/emsdk/emsdk_env.sh
          npm run build

      # The same tests as the native job, compiled to wasm and run in Node.
      # Catches wasm32 differences: 32-bit size_t/long, libc++, no exceptions.
      - name: Test (wasm in Node)
        working-directory: cpp
        run: |
          source ~/emsdk/emsdk_env.sh
          ctest --test-dir build/web --output-on-failure --no-tests=error

      # The runner has no GPU. Chromium brings its own WebGPU driver
      # (SwiftShader); Firefox uses the system's Vulkan driver, lavapipe, and
      # only enables WebGPU under Wayland, so a headless Weston provides one.
      - name: Install Playwright's browsers, lavapipe and Weston
        working-directory: web
        run: |
          npx playwright install --with-deps chromium firefox
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers weston

      # Smoke tests in Chromium, and the image-test scenes in both browsers,
      # saved for the compare job.
      - name: Test (site in Chromium and Firefox)
        working-directory: web
        run: |
          export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-ci --idle-time=0 &
          for _ in $(seq 100); do [ -S "$XDG_RUNTIME_DIR/wayland-ci" ] && break; sleep 0.1; done
          WAYLAND_DISPLAY=wayland-ci npm run test:e2e

      # The benchmark's trades, as natively: Binance's public copy of the brief's day.
      - name: Download a day of trades
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/trades.zip" \
            https://data.binance.vision/data/spot/daily/trades/BTCUSDT/BTCUSDT-trades-2019-12-01.zip
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/trades.zip"

      # As natively, times are compared with the baseline's commit measured on
      # this machine: its site, built in a git worktree. Until the baseline
      # has a row for the web, there's no commit to build, and times aren't
      # compared.
      - name: Build the baseline's commit
        id: web-baseline
        run: |
          if ! commit=$(node tools/check-regressions.mjs baseline-commit web); then
            echo "No web row in the baseline yet: times won't be compared"
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/baseline" "$commit"
          cd "$RUNNER_TEMP/baseline/web"
          npm ci
          source ~/emsdk/emsdk_env.sh
          npm run build
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Memory, reading the trades and the views BenchmarkApp measures
      # natively, in Chromium, without drawing (benchmark.html, run by
      # web/scripts/benchmark.mjs): three runs of each commit's site, served
      # on ports of their own, taking turns to go first; each number's median
      # goes in benchmark.json. The file is read
      # once first, so no run reads it cold. Without a baseline, three runs of
      # this commit alone.
      - name: Benchmark this commit and the baseline's
        working-directory: web
        env:
          TRADES: ${{ runner.temp }}/BTCUSDT-trades-2019-12-01.csv
          BASELINE_COMMIT: ${{ steps.web-baseline.outputs.commit }}
        run: |
          mkdir -p ../benchmark/runs ../benchmark/baseline/runs
          npx vite preview --port 4173 --strictPort &
          ports=4173
          sides="this this this"
          if [ -n "$BASELINE_COMMIT" ]; then
            (cd "$RUNNER_TEMP/baseline/web" && npx vite preview --port 4174 --strictPort) &
            ports="4173 4174"
            sides="baseline this this baseline baseline this"
          fi
          for port in $ports; do
            for _ in $(seq 100); do curl -fs "http://localhost:$port/benchmark.html" > /dev/null && break; sleep 0.2; done
          done
          cat "$TRADES" > /dev/null
          this=0
          other=0
          for side in $sides; do
            if [ "$side" = this ]; then
              this=$((this + 1))
              node scripts/benchmark.mjs "../benchmark/runs/$this.md" "$TRADES" --url http://localhost:4173 --commit "$GITHUB_SHA"
            else
              other=$((other + 1))
              node scripts/benchmark.mjs "../benchmark/baseline/runs/$other.md" "$TRADES" --url http://localhost:4174 \
                --commit "$BASELINE_COMMIT"
            fi
          done
          node ../tools/check-regressions.mjs median ../benchmark/benchmark.json ../benchmark/runs/*.json
          if [ -n "$BASELINE_COMMIT" ]; then
            node ../tools/check-regressions.mjs median ../benchmark/baseline/benchmark.json ../benchmark/baseline/runs/*.json
          fi
          { echo "### View updates in Chromium (wasm), this commit's first run"; cat ../benchmark/runs/1.md; } >> "$GITHUB_STEP_SUMMARY"

      # Both commits' runs and medians: benchmark.json is what accept takes.
      - uses: actions/upload-artifact@v7
        id: benchmark-artifact
        with:
          name: benchmark-web
          path: benchmark/
          if-no-files-found: error

      # As natively.
      - name: Check memory and times against the baseline
        env:
          ARTIFACT_URL: ${{ steps.benchmark-artifact.outputs.artifact-url }}
          BASELINE_COMMIT: ${{ steps.web-baseline.outputs.commit }}
        run: |
          baseline=()
          if [ -n "$BASELINE_COMMIT" ]; then
            baseline=(--baseline benchmark/baseline/benchmark.json)
          fi
          if node tools/check-regressions.mjs check benchmark/benchmark.json "${baseline[@]}" \
            --summary "$RUNNER_TEMP/check.md" --run-id "$GITHUB_RUN_ID" --artifact-url "$ARTIFACT_URL"; then
            status=0
          else
            status=$?
          fi
          { cat "$RUNNER_TEMP/check.md"
            echo "Every accepted change: [regression-baseline.csv](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/tools/regression-baseline.csv)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload the renderings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: renderings-web
          path: renderings
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-web
          path: test-results
          if-no-files-found: ignore

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs
          if-no-files-found: error

  compare:
    name: Compare renderings
    needs: [native, web]
    # Also when a platform failed, to show what the others drew.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: renderings-*
          path: renderings
          merge-multiple: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install the tools' dependencies
        working-directory: tools
        run: npm ci

      # Fails if a known pixel is off, or two platforms (or a platform and
      # tools/reference-renderings/) differ by more than
      # tools/compare-renderings.mjs allows. The numbers go on the run's page.
      - name: Compare
        run: |
          status=0
          node tools/compare-renderings.mjs renderings || status=$?
          cat renderings/report/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status

      # The report with the pictures, unzipped so it opens in the browser. A
      # job summary can't show the pictures themselves: it only shows images
      # from public URLs, and artifacts need a sign-in.
      - id: report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: renderings/report/rendering-comparison.html
          archive: false
          if-no-files-found: ignore

      - name: Link the report
        if: always() && steps.report.outputs.artifact-url
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ci/renderings/
        run: |
          {
            echo ""
            echo "**[Open the report with the pictures]($REPORT_URL)**"
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "(also on [GitHub Pages]($PAGES_URL) once this run publishes it)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The site, for main to publish; there's none to add to when the web
      # job failed, and nothing would publish it anyway.
      - uses: actions/download-artifact@v8
        if: github.ref == 'refs/heads/main' && needs.web.result == 'success'
        with:
          name: site
          path: docs

      - name: Add the comparison to the site
        if: github.ref == 'refs/heads/main' && needs.web.result == 'success'
        run: |
          mkdir -p docs/ci/renderings
          cp renderings/report/rendering-comparison.html docs/ci/renderings/index.html

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && needs.web.result == 'success'
        with:
          path: docs

  summary:
    name: Test summary
    needs: [native, web]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Nothing to download if every build failed; the script says so.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: Write the summary
        run: node .github/scripts/test-summary.mjs test-results >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish to GitHub Pages
    needs: [native, web, compare]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Publish the native binary
    needs: [native, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: native-release

      # One rolling release, replaced on every push to main, so the download
      # link stays the same.
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest trade-viewer-linux-x86_64.tar.gz \
            --target "$GITHUB_SHA" --latest --title "Latest build" \
            --notes "Built from $GITHUB_SHA on Ubuntu 24.04, for Linux x86_64 with Wayland or X11 and a Vulkan driver. Run \`./ViewerApp\` for synthetic data, or \`./ViewerApp BTCUSDT.csv.gz\` for a trades file."

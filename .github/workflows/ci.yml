name: CI

# On every push to dev or main: build and test natively and for the web.
# On main, if everything passed, also publish the site (docs/) to GitHub
# Pages and the native binary to the "latest" release.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time, so main never publishes twice at once; a
# running one finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  EMSDK_VERSION: 6.0.13
  # The shader compiler in wgpu-native v29; the build checks every shader with it.
  NAGA_VERSION: 29.0.4
  # Every test run writes JUnit XML here (see cpp/cmake/testing.cmake); the
  # summary job turns it into one table on the run's page.
  TRADEVIEWER_JUNIT_DIR: ${{ github.workspace }}/test-results

jobs:
  native:
    name: Native build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # GLFW's build dependencies, zlib, and the Vulkan loader with Mesa's
      # software Vulkan driver (lavapipe): the runner has no GPU, and the GPU
      # tests need one.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            zlib1g-dev libvulkan1 mesa-vulkan-drivers

      # Cargo comes with the runner; the cache skips building naga again.
      - name: Cache naga
        id: naga-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/naga
          key: naga-${{ env.NAGA_VERSION }}-${{ runner.os }}

      - name: Install naga
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked

      - name: Configure
        working-directory: cpp
        run: cmake --preset native -DTRADEVIEWER_REQUIRE_NAGA=ON

      - name: Build
        working-directory: cpp
        run: cmake --build --preset native -j "$(nproc)"

      - name: Test
        working-directory: cpp
        run: ctest --test-dir build/native --output-on-failure --no-tests=error

      # Task 1 asks for the visible count and amount of three fixed ranges to
      # match an independent calculation. TradeStatsApp runs the viewer's code and
      # tools/check_ranges.py works them out on its own, here on Binance's
      # public copy of the brief's day. The table goes on the run's page.
      - name: Check visible counts and amounts
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/trades.zip" \
            https://data.binance.vision/data/spot/daily/trades/BTCUSDT/BTCUSDT-trades-2019-12-01.zip
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/trades.zip"
          echo "### Visible count and amount, against an independent calculation" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/check_ranges.py cpp/build/native/apps/TradeStatsApp/TradeStatsApp \
            "$RUNNER_TEMP/BTCUSDT-trades-2019-12-01.csv" | tee -a "$GITHUB_STEP_SUMMARY"

      # Keeps the compiled-out stubs building and passing.
      - name: Build and test with profiling compiled out
        working-directory: cpp
        run: |
          cmake --preset native -B build/native-noprofiling -DTRADEVIEWER_PROFILING=OFF
          cmake --build build/native-noprofiling -j "$(nproc)"
          ctest --test-dir build/native-noprofiling --output-on-failure --no-tests=error

      # One self-contained binary, with wgpu-native linked in statically.
      - name: Build and test the release binary
        working-directory: cpp
        run: |
          cmake --preset native-release
          cmake --build --preset native-release -j "$(nproc)"
          ctest --test-dir build/native-release --output-on-failure --no-tests=error

      # Frame times at four zoom levels, from the profiler: the CPU phases and
      # each GPU pass. lavapipe runs on the CPU, so compare runs with each
      # other, not with real GPUs. Shown on the run's page and kept as a file.
      - name: Benchmark
        run: |
          mkdir -p benchmark
          cpp/build/native-release/apps/BenchmarkApp/BenchmarkApp benchmark/benchmark.md "$RUNNER_TEMP/BTCUSDT-trades-2019-12-01.csv"
          { echo "### Frame times on lavapipe (a CPU Vulkan driver)"; cat benchmark/benchmark.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: benchmark/benchmark.md
          if-no-files-found: error

      # The stripped binary, with the licenses of what's linked into it.
      - name: Package the release binary
        run: |
          build=cpp/build/native-release
          package=dist/trade-viewer
          mkdir -p "$package"
          cp "$build/apps/ViewerApp/ViewerApp" "$package/"
          strip "$package/ViewerApp"
          cp "$build/_deps/glfw-src/LICENSE.md" "$package/LICENSE-glfw.md"
          wgpu_tag=$(cat "$build/_deps/wgpu-linux-x86_64-release-src/wgpu-native-meta/wgpu-native-git-tag")
          curl -fsSL "https://raw.githubusercontent.com/gfx-rs/wgpu-native/$wgpu_tag/LICENSE.MIT" -o "$package/LICENSE-wgpu-native.txt"
          tar -czf dist/trade-viewer-linux-x86_64.tar.gz -C dist trade-viewer

      - uses: actions/upload-artifact@v7
        with:
          name: native-release
          path: dist/trade-viewer-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-native
          path: test-results
          if-no-files-found: ignore

  web:
    name: Web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Builds the wasm module, type-checks, and writes the site to docs/.
      - name: Build
        working-directory: web
        run: |
          source ~/emsdk/emsdk_env.sh
          npm run build

      # The same tests as the native job, compiled to wasm and run in Node.
      # Catches wasm32 differences: 32-bit size_t/long, libc++, no exceptions.
      - name: Test (wasm in Node)
        working-directory: cpp
        run: |
          source ~/emsdk/emsdk_env.sh
          ctest --test-dir build/web --output-on-failure --no-tests=error

      # Smoke-tests the built site in Chromium, with WebGPU on SwiftShader
      # (bundled with Chromium), since the runner has no GPU.
      - name: Install Playwright's Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Test (site in Chromium)
        working-directory: web
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-web
          path: test-results
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: docs

  summary:
    name: Test summary
    needs: [native, web]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Nothing to download if every build failed; the script says so.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: Write the summary
        run: node .github/scripts/test-summary.mjs test-results >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish to GitHub Pages
    needs: [native, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Publish the native binary
    needs: [native, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: native-release

      # One rolling release, replaced on every push to main, so the download
      # link stays the same.
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest trade-viewer-linux-x86_64.tar.gz \
            --target "$GITHUB_SHA" --latest --title "Latest build" \
            --notes "Built from $GITHUB_SHA on Ubuntu 24.04, for Linux x86_64 with Wayland or X11 and a Vulkan driver. Run \`./ViewerApp\` for synthetic data, or \`./ViewerApp BTCUSDT.csv.gz\` for a trades file."
